{% extends 'login/base.html' %}
{% load i18n %}

{% block title %}{% trans 'Log in' %}{% endblock %}

{% block content %}
<h1>{% trans 'Log in' %}</h1>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">{% trans 'Log in' %}</button>
</form>
<div class="links">
    <a class="button secondary" href="{% url 'register' %}">{% trans 'Create an account' %}</a>
</div>
{% endblock %}
