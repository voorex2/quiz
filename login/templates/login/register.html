{% extends 'login/base.html' %}
{% load i18n %}

{% block title %}{% trans 'Registration' %}{% endblock %}

{% block content %}
<h1>{% trans 'Registration' %}</h1>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">{% trans 'Register' %}</button>
</form>
<div class="links">
    <a class="button secondary" href="{% url 'login' %}">{% trans 'Already have an account' %}</a>
</div>
{% endblock %}
